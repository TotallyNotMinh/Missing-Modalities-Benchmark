# ==========================================
# Missing Modalities Benchmark — Base Config
# ==========================================

# Reproducibility
seed: 42

# Hardware
device: cuda
num_workers: 4
pin_memory: true

# Dataset
data:
  raw_dir: data/raw/brats2020
  processed_dir: data/processed
  splits_file: data/splits/splits.json
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  modalities: [t1, t1ce, t2, flair]   # channel order: 0=T1, 1=T1ce, 2=T2, 3=FLAIR
  seg_suffix: seg

# Spatial
patch_size: [128, 128, 128]
full_volume_shape: [240, 240, 155]

# Training defaults
training:
  max_epochs: 200
  batch_size: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  early_stopping_patience: 20
  val_interval: 5
  amp: true                # Automatic Mixed Precision
  gradient_clip: 1.0

# Scenarios
scenarios: [S1, S2, S3, S4]

# Output paths
checkpoints_dir: checkpoints
outputs_dir: outputs
results_dir: results
logs_dir: results/logs

# nnUNet env vars (auto-set by src/utils/config.py)
nnunet:
  raw: data/raw
  preprocessed: data/processed
  results: checkpoints
