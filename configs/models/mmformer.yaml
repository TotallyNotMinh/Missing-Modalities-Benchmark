# ================================================================
# mmFormer — Multimodal Medical Transformer for Incomplete Multimodal Learning
# Zhang et al., MICCAI 2022 | arXiv:2206.02425
# ================================================================

model_name: mmformer
dimension: 3D

network:
  in_channels: 4       # 4 for Oracle/Synthetic; native_missing uses reconstruct_native (zero-padded)
  out_channels: 4      # background + NCR/NET + ED + ET
  patch_size: [128, 128, 128]
  num_classes: 4
  # Paper: CNN encoder filter channels across 5 stages
  encoder_channels: [16, 32, 64, 128, 256]

training:
  # Paper: Adam optimizer (not AdamW)
  optimizer: adam
  # Paper: lr = 2×10^-4
  learning_rate: 2.0e-4
  beta1: 0.9
  beta2: 0.999
  weight_decay: 1.0e-4
  # Paper: Poly LR policy: lr = lr_init × (1 - epoch/max_epoch)^0.9
  lr_scheduler: poly
  poly_exponent: 0.9
  # Paper: 1000 epochs (not 300 — corrected from prior estimate)
  max_epochs: 1000
  # Paper: batch size 1 (or 2 depending on GPU setup)
  batch_size: 1
  amp: true

losses:
  # Paper: Combined Dice + CE loss + auxiliary modality-specific regularizer losses
  dice_weight: 1.0
  ce_weight: 0.5
  # Note: kl_weight does NOT appear in the paper — removed from previous config

early_stopping:
  monitor: dice_mean
  patience: 30
  mode: max
