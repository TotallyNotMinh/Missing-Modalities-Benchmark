# ================================================================
# Med-DDPM — Conditional Diffusion Models for Semantic 3D Brain MRI Synthesis
# Dorjsembe et al., IEEE JBHI 2024 | arXiv:2305.18453
# ================================================================

model_name: med_ddpm
dimension: 3D

network:
  in_channels: 3           # 3 available modalities as conditional input (channel-concat)
  out_channels: 1          # 1 synthesized missing modality
  model_channels: 64
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  channel_mult: [1, 2, 4, 8]
  num_heads: 8
  use_scale_shift_norm: true

diffusion:
  # Paper: T=1000 training timesteps, linear beta schedule
  timesteps: 1000
  beta_schedule: linear
  beta_start: 1.0e-4      # β_1 = 1e-4 (standard linear schedule)
  beta_end: 0.02          # β_T = 0.02 (standard linear schedule)
  # Paper: 250 DDIM steps at inference
  sampling_steps: 250
  sampling_method: ddim
  # Paper: conditioning via channel-wise concatenation of segmentation masks
  conditioning: concat

training:
  # Paper: batch size 4
  batch_size: 4
  # Paper: Adam optimizer, lr=1e-4, β1=0.9, β2=0.999, weight_decay=0
  optimizer: adam
  learning_rate: 1.0e-4
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.0
  # Paper: constant learning rate (no scheduler)
  lr_scheduler: constant
  # Paper: 100,000 training steps
  max_steps: 100000
  max_epochs: 200          # Approximate epoch equivalent for bookkeeping
  amp: true
  gradient_checkpointing: true

# Paper loss: MSE on noise prediction L_simple = E[||ε - ε_θ(x_t, t)||^2], weight=1.0
losses:
  noise_pred_weight: 1.0   # Unweighted MSE on predicted noise (L_simple)

early_stopping:
  monitor: ssim
  patience: 20
  mode: max
